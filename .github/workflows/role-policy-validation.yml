name: Role policy validation

on:
  push:
    branches:
      - security/organization-role-escalation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Format policy files
        run: pnpm exec prettier --write packages/permissions/src/index.ts packages/permissions/src/index.test.ts docs/architecture/decisions/0003-organization-role-management.md
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/permissions/src/index.ts packages/permissions/src/index.test.ts docs/architecture/decisions/0003-organization-role-management.md
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
          else
            git commit -m "style(permissions): apply Prettier formatting [formatted]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
