name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - name: Install dependencies and generate the initial lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Preserve generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile-bootstrap
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
