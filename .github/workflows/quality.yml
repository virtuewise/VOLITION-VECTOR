name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scaffold-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify foundation documents
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/architecture/overview.md
          test -f docs/governance/engineering-standards.md
          test -f docs/security/threat-model.md
          test -f docs/compliance/control-register.md
          test -f docs/roadmap/90-day-plan.md
          echo "Scaffold integrity passed."
