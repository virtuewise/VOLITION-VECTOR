name: Quality gates

on:
  pull_request:
  push:
    branches: [main, ci/ubuntu-26-04]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-26.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Security audit
        run: pnpm audit --audit-level=moderate
      - name: Print outbox test formatting (temporary)
        run: pnpm exec prettier packages/database/src/outbox-repository.test.ts
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
