name: Temporary dependency lockfile refresh

on:
  push:
    branches:
      - security/dependency-advisory-remediation

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile refreshed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - name: Regenerate lockfile from the patched dependency graph
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "The lockfile did not change."
          else
            git commit -m "chore(deps): regenerate patched dependency lockfile [lockfile refreshed]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile
      - name: Audit dependency tree
        run: pnpm audit --audit-level=moderate
