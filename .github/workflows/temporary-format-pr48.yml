name: Temporary PR 48 formatter

on:
  push:
    branches:
      - design/public-website-professional-refresh

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: design/public-website-professional-refresh
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format the files reported by CI
        run: pnpm exec prettier --write apps/web/public-website/app/globals.css apps/web/public-website/app/layout.tsx apps/web/public-website/app/page.tsx
      - name: Commit formatter output
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/public-website/app/globals.css apps/web/public-website/app/layout.tsx apps/web/public-website/app/page.tsx
            git commit -m "style(web): apply repository Prettier formatting"
            git push origin HEAD:design/public-website-professional-refresh
          else
            echo "All targeted files are already formatted."
          fi
