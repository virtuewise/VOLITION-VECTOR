name: Temporary formatting diagnostic

on:
  push:
    branches:
      - "feat/business-workspace-organization-selector"

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Print pinned Prettier output without committing
        run: |
          pnpm exec prettier --write apps/web/business-workspace/app/auth-config.test.ts
          git diff --no-ext-diff -- apps/web/business-workspace/app/auth-config.test.ts
