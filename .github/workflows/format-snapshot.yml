name: Temporary formatter snapshot

on:
  push:
    branches:
      - feat/intelligence-public-search-evaluation-2026-11-25

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Print Prettier-formatted test file
        run: |
          pnpm exec prettier --write apps/api/intelligence/public-search-evaluation.test.ts
          cat apps/api/intelligence/public-search-evaluation.test.ts
