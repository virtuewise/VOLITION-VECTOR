name: Temporary formatting probe

on:
  push:
    branches:
      - identity/postgres-membership-adapter

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format the membership command
        run: pnpm exec prettier --write apps/api/identity/postgres-membership-mutation.command.ts
      - name: Print the formatted source
        run: cat apps/api/identity/postgres-membership-mutation.command.ts
