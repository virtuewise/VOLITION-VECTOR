name: Temporary Prettier preview

on:
  push:
    branches:
      - fix/deps-glob-minimatch-nov-2026

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Format advisory record and print the exact diff
        run: |
          pnpm exec prettier --write docs/security/dependency-advisories.md
          git --no-pager diff -- docs/security/dependency-advisories.md
