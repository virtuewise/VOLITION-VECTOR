name: Temporary Prettier preview

on:
  push:
    branches:
      - feat/trust-private-evidence-read-api

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Format candidate files and print the exact diff
        run: |
          pnpm exec prettier --write \
            apps/api/trust/trust-evidence.controller.test.ts \
            packages/database/src/tenant-transaction.ts \
            packages/database/src/trust-evidence-repository.ts \
            packages/database/src/trust-evidence-repository.test.ts
          git --no-pager diff -- \
            apps/api/trust/trust-evidence.controller.test.ts \
            packages/database/src/tenant-transaction.ts \
            packages/database/src/trust-evidence-repository.ts \
            packages/database/src/trust-evidence-repository.test.ts
