name: Temporary account profile formatter
on:
  pull_request:
    branches: [main]
jobs:
  format-preview:
    if: github.head_ref == 'feat/identity-account-profile-self-service'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format account profile files
        run: |
          pnpm exec prettier --write \
            apps/api/identity/account-profile.controller.ts \
            apps/api/identity/account-profile.service.test.ts \
            apps/api/identity/account-profile.service.ts \
            apps/api/identity/postgres-tenant-connection.pool.test.ts \
            packages/database/src/account-context.test.ts \
            packages/database/src/account-profile-repository.test.ts \
            packages/database/src/account-profile-repository.ts
      - name: Print formatter diff
        run: |
          git diff -- \
            apps/api/identity/account-profile.controller.ts \
            apps/api/identity/account-profile.service.test.ts \
            apps/api/identity/account-profile.service.ts \
            apps/api/identity/postgres-tenant-connection.pool.test.ts \
            packages/database/src/account-context.test.ts \
            packages/database/src/account-profile-repository.test.ts \
            packages/database/src/account-profile-repository.ts
