name: Staging database migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY to run the staging database migration runner"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'APPLY'
    name: Apply versioned migrations to Staging
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: staging
    env:
      DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build migration runner
        run: pnpm --filter @volition/api... run build
      - name: Apply staging migrations
        run: pnpm --filter @volition/api db:migrate
