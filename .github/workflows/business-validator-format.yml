name: Temporary business workspace validator formatting

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatter-output:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Print exact pinned Prettier output
        run: |
          pnpm exec prettier --write apps/web/business-workspace/app/workspace-data.ts
          cat apps/web/business-workspace/app/workspace-data.ts
