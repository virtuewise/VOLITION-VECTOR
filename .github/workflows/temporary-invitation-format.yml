name: Temporary invitation formatter inspection

on:
  push:
    branches:
      - identity/invitation-postgres-repository

permissions:
  contents: read

jobs:
  inspect-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format target file and print exact diff
        run: |
          pnpm exec prettier --write packages/database/src/invitation-repository.ts
          git diff -- packages/database/src/invitation-repository.ts
