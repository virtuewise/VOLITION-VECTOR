name: Temporary lifecycle formatter

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-lifecycle-formatter.yml"
      - "packages/database/src/opportunity-repository.ts"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'opportunity/listing-lifecycle-controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/database/src/opportunity-repository.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add packages/database/src/opportunity-repository.ts
          git commit -m "style(opportunity): format lifecycle repository"
          git push
