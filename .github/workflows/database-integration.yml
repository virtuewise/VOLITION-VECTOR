name: PostgreSQL tenant security integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "packages/database/prisma/migrations/**"
      - "packages/database/src/**"
      - "packages/database/package.json"
      - "apps/api/src/scripts/**"
      - "apps/api/package.json"
      - "apps/api/tsconfig.json"
      - "apps/api/identity/**"
      - "pnpm-lock.yaml"
      - "tests/integration/**"
      - ".github/workflows/database-integration.yml"

permissions:
  contents: read

jobs:
  postgres-rls:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: volition_vector
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d volition_vector"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/volition_vector
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/volition_vector
      RUNTIME_DATABASE_URL: postgresql://vv_runtime:runtime-test@localhost:5432/volition_vector
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the API migration runner
        run: pnpm --filter @volition/api... run build
      - name: Apply versioned SQL migrations
        run: pnpm --filter @volition/api db:migrate
      - name: Verify migration runner is idempotent
        run: pnpm --filter @volition/api db:migrate
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Verify tenant isolation and append-only audit events
        run: bash tests/integration/database-rls.sh
      - name: Verify the real API runtime-role startup guard
        run: pnpm --filter @volition/api db:verify-runtime
