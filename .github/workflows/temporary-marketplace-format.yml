name: Temporary marketplace formatting helper

on:
  push:
    branches:
      - feat/marketplace-public-discovery
    paths:
      - ".github/workflows/temporary-marketplace-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier formatting
        run: >-
          pnpm exec prettier --write
          apps/web/marketplace/app/public-data.ts
          apps/web/marketplace/app/public-data.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet -- apps/web/marketplace/app/public-data.ts apps/web/marketplace/app/public-data.test.ts; then
            echo "Marketplace files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/marketplace/app/public-data.ts apps/web/marketplace/app/public-data.test.ts
          git commit -m "style(marketplace): apply repository Prettier formatting"
          git push origin HEAD:${{ github.ref_name }}
