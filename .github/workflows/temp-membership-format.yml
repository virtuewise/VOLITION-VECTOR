name: Temporary membership formatter inspection

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and print exact diff
        run: |
          pnpm exec prettier --write packages/database/src/membership-repository.ts packages/database/src/membership-repository.test.ts
          git diff -- packages/database/src/membership-repository.ts packages/database/src/membership-repository.test.ts
