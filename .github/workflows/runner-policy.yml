name: Runner policy

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  ubuntu-runner-policy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Require Ubuntu 26.04 for every repository-managed workflow job
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t declarations < <(
            grep -RInE '^[[:space:]]*runs-on:' .github/workflows \
              --include='*.yml' --include='*.yaml' || true
          )
          if [ "${#declarations[@]}" -eq 0 ]; then
            echo "No workflow runner declarations were found." >&2
            exit 1
          fi
          failed=0
          for declaration in "${declarations[@]}"; do
            if [[ ! "$declaration" =~ runs-on:[[:space:]]*ubuntu-26\.04[[:space:]]*$ ]]; then
              echo "Unsupported workflow runner: $declaration" >&2
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All repository-managed workflow jobs use ubuntu-26.04."
