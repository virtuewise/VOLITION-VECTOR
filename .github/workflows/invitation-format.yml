name: Format invitation lifecycle files

on:
  push:
    branches:
      - identity/invitation-lifecycle-service

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format invitation files
        run: pnpm exec prettier --write apps/api/identity/invitations/invitation.service.ts apps/api/identity/invitations/invitation.service.test.ts docs/architecture/decisions/0004-invitation-lifecycle.md
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/identity/invitations/invitation.service.ts apps/api/identity/invitations/invitation.service.test.ts docs/architecture/decisions/0004-invitation-lifecycle.md
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
          else
            git commit -m "style(identity): apply Prettier formatting [formatted]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
