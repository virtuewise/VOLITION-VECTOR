name: Temporary project formatter

on:
  push:
    branches: [project/workspace-foundation]
    paths:
      - ".github/workflows/temporary-project-formatter.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'project/workspace-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm install --global --allow-scripts=pnpm pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/contracts/src/project.ts packages/permissions/src/index.ts packages/permissions/src/index.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add packages/contracts/src/project.ts packages/permissions/src/index.ts packages/permissions/src/index.test.ts
          git commit -m "style(project): format workspace contracts and policies"
          git push
