packages:
  - "apps/web/*"
  - "apps/api"
  - "apps/mobile"
  - "apps/worker"
  - "packages/*"

overrides:
  "glob@^13.0.0": "14.0.6"
  "minimatch@^10.0.0": "11.0.8"
  "minimatch@^11.0.4": "11.0.8"
  # Keep the Expo SDK 58 fingerprint tool on its declared compatible majors.
  # The path is in pnpm's mobile production dependency graph via expo, although
  # Expo's maintainer assesses it as tooling-only/not shipped in app bundles.
  # Bundle exclusion is not independently verified; see the advisory record.
  "@expo/fingerprint>glob": "13.0.6"
  "@expo/fingerprint>minimatch": "10.2.6"
  "glob@^13.0.0>minimatch": "10.2.6"

# These two moderate findings remain on the Expo fingerprint path. The path
# is present in the mobile production dependency graph; upstream says it is
# tooling-only, but bundle exclusion is unverified. See the advisory record.
# Remove these ignores when Expo ships a compatible patched path.
audit:
  ignore:
    - GHSA-3g3m-2fjr-6pw4
    - GHSA-g3hv-75wg-m249

# Explicitly approve only the native build scripts required by this workspace.
allowBuilds:
  esbuild: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - bullmq@6.7.0
