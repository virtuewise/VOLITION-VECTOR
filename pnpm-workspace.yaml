packages:
  - "apps/web/*"
  - "apps/api"
  - "apps/mobile"
  - "apps/worker"
  - "packages/*"

overrides:
  "minimatch@^10.0.0": "11.0.8"
  "minimatch@^11.0.4": "11.0.8"
  # Expo SDK 58.0.25's fingerprint package drops glob. Keep its declared
  # minimatch 10.x major until Expo's compatibility boundary changes.
  "@expo/fingerprint>minimatch": "10.2.6"

# One moderate finding remains on Expo's build-time fingerprint dependency.
# pnpm's GHSA ignore is global by advisory ID, not path-scoped. The lockfile
# guard in scripts/check-minimatch-exception.mjs asserts that the only affected
# copy is @expo/fingerprint>minimatch@10.2.6. Remove the ignore and guard when
# Expo provides a compatible patched dependency.
audit:
  ignore:
    - GHSA-g3hv-75wg-m249

# Explicitly approve only the native build scripts required by this workspace.
allowBuilds:
  esbuild: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - bullmq@6.7.0
